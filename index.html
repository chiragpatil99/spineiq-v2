<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#6C3FE8">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>SpineIQ v2</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="toast-coin"></div>
<div id="toast"></div>
<div id="confetti-container"></div>

<div class="app-shell">
  <header class="app-header">
    <div class="brand-row">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24"><path d="M12 3c-3 0-5 2.5-5 5.5 0 2 1 3.5 2 5L12 22l3-8.5c1-1.5 2-3 2-5C17 5.5 15 3 12 3z"/><circle cx="12" cy="8.5" r="1.5" fill="#fff" stroke="none"/></svg>
      </div>
      <div>
        <div class="brand-name">SpineIQ</div>
        <div class="brand-tagline">Spine Health Quest</div>
      </div>
    </div>
    <div class="coin-display">
      <span class="coin-icon">🪙</span>
      <span class="coin-count" id="coin-count">0</span>
    </div>
  </header>

  <div class="app-content" id="app-content">
    <div id="screen-home"   class="screen active"></div>
    <div id="screen-track"  class="screen"></div>
    <div id="screen-assess" class="screen">
      <div class="step-progress-wrap" id="step-progress-wrap">
        <div class="step-progress-inner">
          <div class="step-progress-top">
            <span class="step-name" id="step-name">Patient Info</span>
            <span class="step-xp" id="step-xp">+10 🪙</span>
          </div>
          <div class="xp-track"><div class="xp-fill" id="xp-fill" style="width:11%"></div></div>
          <div class="step-dots-row" id="step-dots"></div>
        </div>
      </div>
      <div class="step-body" id="main"></div>
      <div class="step-actions" id="step-actions"></div>
    </div>
    <div id="screen-report"  class="screen"></div>
    <div id="screen-levels"  class="screen"></div>
    <div id="screen-rewards" class="screen"></div>
  </div>

  <nav class="tab-bar">
    <button class="tab active" id="tab-home" onclick="switchTab('home')">
      <div class="tab-icon-wrap">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      </div>
      <span>Home</span>
    </button>
    <button class="tab" id="tab-track" onclick="switchTab('track')">
      <div class="tab-icon-wrap">
        <svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        <div class="tab-dot" id="tab-track-dot"></div>
      </div>
      <span>Track</span>
    </button>
    <button class="tab tab-center" id="tab-assess" onclick="switchTab('assess')">
      <div class="tab-icon-wrap tab-center-icon">
        <svg viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="2"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="13" y2="16"/></svg>
      </div>
      <span>Quest</span>
    </button>
    <button class="tab" id="tab-levels" onclick="switchTab('levels')">
      <div class="tab-icon-wrap">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89L17 22l-5-3-5 3 1.523-9.11"/></svg>
        <div class="tab-dot" id="tab-ach-dot"></div>
      </div>
      <span>Levels</span>
    </button>
    <button class="tab" id="tab-rewards" onclick="switchTab('rewards')">
      <div class="tab-icon-wrap">
        <svg viewBox="0 0 24 24"><path d="M20 12v10H4V12"/><path d="M22 7H2v5h20V7z"/><path d="M12 22V7"/><path d="M12 7H7.5a2.5 2.5 0 010-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 000-5C13 2 12 7 12 7z"/></svg>
        <div class="tab-dot" id="tab-report-dot"></div>
      </div>
      <span>Rewards</span>
    </button>
  </nav>
</div>

<script src="js/data.js"></script>
<script src="js/scoring.js"></script>
<script src="js/gamification.js"></script>
<script src="js/bodymap.js?v=1781660859"></script>
<script src="js/home.js?v=1781660859"></script>
<script src="js/track.js?v=1781660859"></script>
<script src="js/rewards.js?v=1781660859"></script>
<script src="js/pages.js"></script>
<script src="js/app.js"></script>
</body>
</html>
